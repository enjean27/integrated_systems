<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign In | Integrated EventVote</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: radial-gradient(
          circle at top left,
          #12375b 0%,
          #071428 35%,
          #030a13 100%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: #e6eef8;
      }
      .card {
        width: 100%;
        max-width: 480px;
        background: rgba(6, 14, 24, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 32px;
        box-shadow: 0 24px 70px rgba(2, 6, 23, 0.55);
        backdrop-filter: blur(10px);
      }
      .logo {
        text-align: center;
        margin-bottom: 16px;
      }
      .logo img {
        height: 96px;
        width: auto;
      }
      h1.title {
        text-align: center;
        margin: 6px 0 6px;
        font-size: 28px;
        color: #bfe6ff;
      }
      p.subtitle {
        text-align: center;
        color: #8fb3cf;
        margin: 0 0 20px;
      }
      .flash {
        margin-bottom: 14px;
        padding: 12px 14px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
        color: #ffdede;
        font-size: 14px;
      }
      form {
        display: block;
      }
      .field {
        margin-bottom: 14px;
      }
      .field label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: #b7cfe3;
        font-weight: 600;
      }
      .field input {
        width: 100%;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        background: rgba(255, 255, 255, 0.04);
        color: #f4f9ff;
        font-size: 15px;
        outline: none;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }
      .field input:focus {
        border-color: #2fb8ff;
        box-shadow: 0 0 0 3px rgba(47, 184, 255, 0.2);
      }
      .password-wrap {
        position: relative;
      }
      .password-wrap button {
        position: absolute;
        top: 50%;
        right: 10px;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        color: #8fb3cf;
        cursor: pointer;
        font-size: 16px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 6px;
        margin-bottom: 18px;
      }
      .remember {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #9eb7d6;
        font-size: 13px;
      }
      .link {
        color: #5fc3ff;
        text-decoration: none;
        font-size: 13px;
      }
      .link:hover {
        text-decoration: underline;
      }
      .btn {
        width: 100%;
        display: inline-block;
        padding: 14px 18px;
        background: linear-gradient(90deg, #1990ff, #2fb8ff);
        border-radius: 12px;
        border: none;
        color: #042a3d;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }
      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 24px rgba(47, 184, 255, 0.2);
      }
      .footer {
        text-align: center;
        margin-top: 16px;
        color: #94b8d8;
        font-size: 13px;
      }
      @media (max-width: 520px) {
        .card {
          padding: 22px;
          border-radius: 16px;
        }
        .logo img {
          height: 80px;
        }
        h1.title {
          font-size: 24px;
        }
        .row {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <img
          src="{{ url_for('static', filename='uploads/logo.png') }}"
          alt="logo"
          onerror="this.style.display = 'none'"
        />
      </div>
      <h1 class="title">Integrated EventVote</h1>
      <p class="subtitle">Events. Voting. Connected.</p>

      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}
      <div class="flash">{{ message }}</div>
      {% endfor %} {% endif %} {% endwith %}

      <form
        method="post"
        action="{{ url_for('auth.login') }}"
        autocomplete="on"
      >
        <div class="field">
          <label for="student_id">Student ID</label>
          <input
            id="student_id"
            name="student_id"
            type="text"
            placeholder="Enter your student ID"
            required
            autocomplete="username"
          />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            />
            <button
              type="button"
              id="togglePassword"
              aria-label="Show password"
            >
              <span id="toggleIcon">👁️</span>
            </button>
          </div>
        </div>

        <div class="row">
          <label class="remember">
            <input type="checkbox" name="remember" /> Remember me
          </label>
          <a class="link" href="#">Forgot password?</a>
        </div>

        <button class="btn" type="submit">Sign In</button>

        <div class="footer">
          Don't have an account?
          <a class="link" href="{{ url_for('auth.register') }}">Register</a>
        </div>
      </form>
    </div>

    <script>
      const togglePassword = document.getElementById("togglePassword");
      const passwordInput = document.getElementById("password");
      const toggleIcon = document.getElementById("toggleIcon");

      if (togglePassword && passwordInput && toggleIcon) {
        togglePassword.addEventListener("click", () => {
          const isPassword = passwordInput.type === "password";
          passwordInput.type = isPassword ? "text" : "password";
          toggleIcon.textContent = isPassword ? "🙈" : "👁️";
          togglePassword.setAttribute(
            "aria-label",
            isPassword ? "Hide password" : "Show password",
          );
        });
      }
    </script>
  </body>
</html>
