{% extends 'base.html' %} {% block title %}Change Password | Integrated Portal{% endblock
%} {% block head_extras %}
<style>
  .profile-page {
    max-width: 700px;
    margin: 36px auto;
    padding: 0 16px;
  }

  .profile-card {
    background: #111827;
    border: 1px solid rgba(148, 163, 184, 0.12);
    border-radius: 22px;
    padding: 28px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
  }

  .profile-card h2 {
    color: #f8fafc;
    margin-bottom: 8px;
  }

  .profile-card p {
    color: #94a3b8;
    margin-bottom: 24px;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;
    color: #cbd5e1;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .form-group input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid rgba(148, 163, 184, 0.16);
    background: #1f2937;
    color: #f8fafc;
    font-size: 1rem;
  }

  .form-group input:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
  }

  .form-actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
  }

  .btn {
    padding: 12px 24px;
    border-radius: 12px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    border: none;
    font-size: 1rem;
  }

  .btn-primary {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
  }

  .btn-secondary {
    background: rgba(37, 99, 235, 0.12);
    color: #bfdbfe;
    border: 1px solid rgba(37, 99, 235, 0.24);
  }
</style>
{% endblock %} {% block content %}
<div class="profile-page">
  <div class="profile-card">
    <h2>🔒 Change Password</h2>
    <p>Update your password to keep your account secure</p>
    
    <form method="post">
      <div class="form-group">
        <label for="current_password">Current Password</label>
        <input 
          type="password" 
          id="current_password" 
          name="current_password" 
          required 
        />
      </div>
      
      <div class="form-group">
        <label for="new_password">New Password</label>
        <input 
          type="password" 
          id="new_password" 
          name="new_password" 
          required 
          minlength="8"
        />
      </div>
      
      <div class="form-group">
        <label for="confirm_password">Confirm New Password</label>
        <input 
          type="password" 
          id="confirm_password" 
          name="confirm_password" 
          required 
          minlength="8"
        />
      </div>
      
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Change Password</button>
        <a href="{{ url_for('auth.profile') }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
